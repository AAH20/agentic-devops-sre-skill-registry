name: Validate skill registry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: |
          for skill in skills/*; do
            PYTHONPATH=src python -m cloudops_skills.cli validate "$skill"
          done
      - run: PYTHONPATH=src python -m cloudops_skills.cli score evals/reference-results.json
      - run: python -m pip wheel . --no-deps --wheel-dir dist
